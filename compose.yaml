services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: 'supermarket-postgres'
    environment:
      - 'POSTGRES_DB=${DB_DATABASE}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'PGDATA=${DB_DATA}'
    # local port and docker port bridge
    ports:
      - '5432:5432'
    # data copy directory in local
    volumes:
      - 'postgres_data:/var/lib/postgresql/data/'
    networks:
      - supermarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  supermarket-network:
    driver: bridge